name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout del código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 PyQtWebEngine gpxpy matplotlib playwright
        # Descargamos solo Chromium para que el ZIP no pese una barbaridad
        playwright install chromium

    - name: 🔨 Compilar con PyInstaller
      run: |
        # Asumiendo que tu archivo principal se llama app_7.py. Cámbialo si se llama distinto.
        pyinstaller --name "CaminsRals" --windowed --onedir app_7.py

    - name: 🌐 Incluir navegadores de Playwright
      # Copiamos la carpeta oculta de Playwright a la carpeta compilada
      # para que el bloque de código de compatibilidad de tu app la encuentre.
      run: |
        Copy-Item -Path "$env:LOCALAPPDATA\ms-playwright" -Destination "dist\CaminsRals\ms-playwright" -Recurse

    - name: 🗜️ Subir ZIP final
      uses: actions/upload-artifact@v4
      with:
        name: CaminsRals-Windows
        path: dist\CaminsRals\
